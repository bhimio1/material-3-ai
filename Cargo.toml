[package]
name = "material_3_ai"
version = "0.1.0"
edition = "2021"
description = "Material 3 AI: a Material 3 desktop app for Claude Code, built with egui"
license = "MIT"

[[bin]]
name = "m3-ai"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
material-3-ui = { git = "https://github.com/bhimio1/material-3-ui", rev = "81c14000c29fb3cfefb0b77344b110a518bfed45", features = ["markdown", "notify"] }
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
dirs = "6"
anyhow = "1"
chrono = "0.4"
fuzzy-matcher = "0.3"
log = "0.4"
env_logger = "0.11"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "3"
ignore = "0.4"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "file_chooser"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
